<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo: CFO Payment Diversion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #07111d;
            color: #e9f4f8;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        .inner {
            padding-top: 56px;
            padding-left: 76px;
            padding-right: 76px;
        }
        .kicker {
            font: 11px monospace;
            color: #35d7e9;
            letter-spacing: 2px;
        }
        .title {
            margin-top: 14px;
            font-size: 42px;
            letter-spacing: -2px;
            font-weight: 800;
        }
        .content-wrap {
            display: flex;
            margin-top: 48px;
            gap: 40px;
        }
        .visual-side {
            width: 540px;
            height: 420px;
            border: 8px solid #214157;
            position: relative;
        }
        .visual-side img {
            width: 524px;
            height: 404px;
            object-fit: cover;
        }
        .data-side {
            flex: 1;
        }
        .metric-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }
        .metric-box {
            flex: 1;
            border-top: 4px solid #35d7e9;
            padding-top: 16px;
        }
        .metric-box.magenta { border-color: #b856d9; }
        .metric-box.amber { border-color: #e1aa3d; }
        .metric-label {
            font: 10px monospace;
            color: #92a9b5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .metric-value {
            font-size: 36px;
            font-weight: 800;
            margin-top: 8px;
        }
        .metric-value span {
            font-size: 18px;
            color: #92a9b5;
            font-weight: 400;
        }
        .signal-list {
            margin-top: 32px;
            border: 2px solid #214157;
            background: rgba(33, 65, 87, 0.2);
        }
        .signal-item {
            padding: 12px 16px;
            border-bottom: 1px solid #214157;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font: 13px monospace;
        }
        .signal-item:last-child { border-bottom: none; }
        .signal-tag {
            padding: 2px 6px;
            font-size: 10px;
            border: 1px solid currentColor;
        }
        .cyan { color: #35d7e9; }
        .magenta { color: #b856d9; }
        .amber { color: #e1aa3d; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="inner">
            <div class="kicker">06 / LIVE DEMONSTRATION</div>
            <h1 class="title">Demo: CFO payment diversion</h1>
            
            <div class="content-wrap">
                <div class="visual-side">
                    <img src="/home/ubuntu/upload/search_images/QSWi9rhvbuQN.jpg" alt="SOC Dashboard">
                </div>
                
                <div class="data-side">
                    <div class="metric-row">
                        <div class="metric-box">
                            <div class="metric-label">Risk Score</div>
                            <div class="metric-value cyan">95<span>/100</span></div>
                        </div>
                        <div class="metric-box magenta">
                            <div class="metric-label">Confidence</div>
                            <div class="metric-value magenta">94%</div>
                        </div>
                    </div>
                    
                    <div class="metric-box amber">
                        <div class="metric-label">Business Impact</div>
                        <div class="metric-value amber">$84,500</div>
                    </div>
                    
                    <div class="signal-list">
                        <div class="signal-item">
                            <span>Urgent payment request</span>
                            <span class="signal-tag cyan">EMAIL</span>
                        </div>
                        <div class="signal-item">
                            <span>Look-alike payment domain</span>
                            <span class="signal-tag magenta">URL</span>
                        </div>
                        <div class="signal-item">
                            <span>Voice note authenticity anomaly</span>
                            <span class="signal-tag amber">AUDIO</span>
                        </div>
                        <div class="signal-item">
                            <span>Unapproved communication channel</span>
                            <span class="signal-tag magenta">IDENTITY</span>
                        </div>
                        <div class="signal-item">
                            <span>Related infrastructure alert</span>
                            <span class="signal-tag cyan">NETWORK</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Ask</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #07111d;
            color: #e9f4f8;
            font-family: Arial, sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .accent-rule {
            width: 240px;
            height: 12px;
            background: #35d7e9;
            margin-bottom: 48px;
        }
        .statement {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1.1;
            max-width: 960px;
        }
        .statement span {
            color: #35d7e9;
        }
        .thank-you {
            position: absolute;
            bottom: 80px;
            font: 24px monospace;
            color: #9ab0bd;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .brand-tag {
            position: absolute;
            top: 64px;
            left: 84px;
            font: 12px monospace;
            letter-spacing: 3px;
            color: #6de7f7;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="brand-tag">AEGISNEXUS / CONCLUSION</div>
        <div class="accent-rule"></div>
        <h1 class="statement">
            AegisNexus turns scattered communication warnings into one <span>explainable, human-approved</span> incident decision.
        </h1>
        <div class="thank-you">Thank you.</div>
    </div>
</body>
</html>
